@if(this.producto().id != -1){
  @if (producto().imagen_url) { <img [src]="producto().imagen_url" [alt]="producto().nombre" style="max-width: 100%; width: 360px; height: 400px; object-fit: cover; border-radius: 8px"> }
  <h1>{{ producto()?.nombre }}</h1>
  <p>{{ producto()?.descripcion }}</p>
  <p><strong>Precio:</strong> {{ producto()?.precio  | currency:'ARS':'symbol':'1.2-2' }}</p>
  <p><strong>Stock disponible:</strong> {{ producto().stock }} unidades</p>
  <app-agregar-al-carrito-button [producto]="producto()" [waitingForCarritoEvent]="this.waitingForCarritoEvent()" (carritoEvent)="this.agregarAlCarrito()"></app-agregar-al-carrito-button>
}
