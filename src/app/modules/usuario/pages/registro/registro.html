<div class="auth-shell">
  <aside>
    <a class="brand" routerLink="/">TRAMA<span>.</span></a>
    <div class="hero">
      <span>HACÉ ESPACIO PARA ALGO NUEVO</span>
      <h1>Tu estilo.<br />Tu cuenta.</h1>
      <p>Prendas para acompañarte todos los días.</p>
    </div>
    <small>TIENDA DE ROPA · HECHA PARA TODOS LOS DÍAS</small>
  </aside>
  <main>
    <div class="auth-card">
      <span class="eyebrow">SUMATE A TRAMA</span>
      <h2>Creá tu cuenta</h2>
      <p>Completá tus datos para empezar.</p>
      <app-formulario-usuario
        [action]="'registrarse'"
        (submit)="registrar($event)"
        [errorMessage]="errorMessage()"
        [sent]="waitingForResponse()"
      ></app-formulario-usuario>
      <p class="signup-link">
        ¿Ya tenés cuenta?
        <a routerLink="/bienvenido/login" [queryParams]="{ returnUrl: retorno }">Iniciá sesión</a>
      </p>
    </div>
    <a class="browse-link" routerLink="/tienda/productos"
      >Seguir mirando la tienda sin crear una cuenta →</a
    >
  </main>
</div>
