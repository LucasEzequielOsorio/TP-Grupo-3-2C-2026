<form (submit)="OnSubmit($event)" action="" method="post">
  <label for="email">E-mail</label><input type="email" id="email" [formField]="formulario.email">
  <label for="password">Contraseña</label><input type="password" id="password" [formField]="formulario.password">
  @if(action() == 'registrarse')
  {
    <label for="passwordRepeat">Repetir contraseña</label><input type="password" id="passwordRepeat" [value]="repeatPassword()" (input)="repeatPassword.set($any($event.target).value)">
  }
  <button type="submit" [disabled]="!campoEmailValido() || !campoPasswordValido()">{{ action() }}</button>
</form>
